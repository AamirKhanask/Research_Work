# @package _global_

defaults:
  - default.yaml

GENERAL:
  TOTAL_STEPS: 20000                      # Changed from 15000 to 20000
  LOG_STEPS: 100                          # Keep same
  VAL_STEPS: 2000                         # Keep same
  CHECKPOINT_STEPS: 10000                 # Changed from 5000 to 10000
  CHECKPOINT_SAVE_TOP_K: 1                # Keep same
  NUM_WORKERS: 4
  PREFETCH_FACTOR: 2

TRAIN:
  LR: 1e-4                                # CHANGED: Much higher for MatMul-Free (was 1e-5)
  #WARMUP_STEPS: 1000    # Optional: gradual LR increase
  #LR_SCHEDULER: "cosine"  # Optional: cosine decay
  WEIGHT_DECAY: 1e-4
  BATCH_SIZE: 8
  LOSS_REDUCTION: mean
  NUM_TRAIN_SAMPLES: 2
  NUM_TEST_SAMPLES: 64
  POSE_2D_NOISE_RATIO: 0.01
  SMPL_PARAM_NOISE_RATIO: 0.005
  #WARMUP_STEPS: 500  # Gradual increase
  GRAD_CLIP_VAL: 0                      # ADDED: Gradient clipping for stability

MODEL:
  IMAGE_SIZE: 256
  IMAGE_MEAN: [0.485, 0.456, 0.406]
  IMAGE_STD: [0.229, 0.224, 0.225]
  BACKBONE:
    TYPE: vit
    # PRETRAINED_WEIGHTS: REMOVED - Cannot use pretrained ViT weights because architecture changed
    # New MatMul-free attention has different structure
    TOKEN_MIXER_TYPE: "ss2d_mlgru"        # ADDED: Use your new attention
    TOKEN_MIXER_HEADS: 16                 # ADDED: Same as original num_heads
  MANO_HEAD:
    TYPE: transformer_decoder
    IN_CHANNELS: 2048
    TRANSFORMER_DECODER:
      depth: 6
      heads: 8
      mlp_dim: 1024
      dim_head: 64
      dropout: 0.0
      emb_dropout: 0.0
      norm: layer
      context_dim: 1280

LOSS_WEIGHTS:
  KEYPOINTS_3D: 0.05
  KEYPOINTS_2D: 0.01
  GLOBAL_ORIENT: 0.001
  HAND_POSE: 0.001
  BETAS: 0.0005
  ADVERSARIAL: 0.0005